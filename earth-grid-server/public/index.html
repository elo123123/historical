<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anno Domini 300</title>
    <!-- 외부 CSS 파일 연결 -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- 맵 캔버스 영역 -->
    <div id="canvas-container">
        <canvas id="mapCanvas"></canvas>
    </div>

    <!-- 하단 목재 패널 -->
    <div id="bottom-panel">
        <!-- 좌측 좌표 및 지명 정보 박스 3개 -->
        <div class="left-info-container">
            <!-- 선택 지형 / 프로빈스 / 도시 이름 -->
            <div id="info-name" class="info-box">선택 영역: -</div>
            <!-- 위도 / 경도 -->
            <div id="info-latlon" class="info-box">위도/경도: -</div>
            <!-- 맵 X, Y 좌표 -->
            <div id="info-map-pos" class="info-box">좌표: -</div>
        </div>

        <!-- 메시지 출력용 패널 -->
        <div id="message-panel" class="black-message-panel" role="log" aria-live="polite"></div>

        <!-- 우측 목재 버튼 -->
        <button id="action-btn" class="pixel-wood-btn">실행</button>
    </div>

    <!-- 외부 자바스크립트 파일 연결 -->
    <script src="./js/search.js"></script>
    <script src="./js/command_action.js"></script>
    <script src="./js/render.js"></script>
    <script src="./js/event.js"></script>

</body>
</html>
